{% extends "base.html" %}{% block title %}Log In — Data Quality Checker{% endblock %}{% block content %}<div class="auth-container"><div class="auth-card"><div class="auth-header"><div class="brand-icon" style="margin: 0 auto 12px auto;" aria-hidden="true">DQ</div><h1 class="auth-title">Welcome Back</h1><p class="auth-subtitle">Log in to manage your profile, view saved datasets, and access account features.</p></div><form method="POST" action="{{ url_for('auth.login') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="next" value="{{ next or '' }}"><div class="form-group"><label class="form-label" for="loginEmail">Email Address</label><input type="email" id="loginEmail" name="email" class="form-control" value="{{ email or '' }}" placeholder="you@example.com" required autocomplete="email"></div><div class="form-group"><label class="form-label" for="loginPassword">Password</label><input type="password" id="loginPassword" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password"></div><div class="form-group" style="display: flex; align-items: center; justify-content: space-between;"><label style="display: flex; align-items: center; gap: 8px; font-size: 12px; cursor: pointer; color: var(--text-secondary);"><input type="checkbox" name="remember_me" value="1" checked><span>Remember this device</span></label></div><div style="margin-top: 20px;"><button type="submit" class="btn btn-accent" style="width: 100%; justify-content: center; padding: 10px 14px; font-size: 14px;" id="btnSubmitLogin">Log In</button></div></form><div class="auth-footer"><p>Don't have an account yet? <a href="{{ url_for('auth.signup', next=next) }}" style="font-weight: 600;">Sign up for free</a></p><div style="margin-top: 14px;"><a href="{{ url_for('main.index') }}" class="btn btn-secondary btn-sm">&larr; Return to Checker</a></div></div></div></div>{% endblock %}
